; MemberVariableLayout.ini for Stellar Blade build 26123051 (executable TimeDateStamp 0x6ad8eff1, SizeOfImage
; 0x15fa3000). Every value was read in Ghidra on build 26123051. For every struct and key this file does not set,
; UE4SS v4.0.0 uses its built-in UE 4.26 layout.
;
; FUObjectArray differs from UE 4.26: its ObjAvailableList is 0x10 bytes, so the listener arrays sit at 0x68 and 0x78
; (UE 4.26: 0xE0 and 0xF0) and MasterSerialNumber at 0xB0 (UE 4.26: 0x128). UE4SS adds a delete listener at every
; start. Without this file it would write it past the end of the game's FUObjectArray.
; GUObjectArray is 0x146ddd240 (UE4SS_Signatures/GUObjectArray.lua finds it).

[FUObjectArray]
; 0x146ddd240: AllocateUObjectIndex (FUN_142b890d0) reads it before it logs "Unable to add more objects to disregard
; for GC pool"; FUN_142b8bc20 (the object pool's allocation) writes it.
ObjFirstGCIndex = 0x0
; 0x146ddd244: AllocateUObjectIndex (FUN_142b890d0) increments it for each object in the disregard for GC pool.
ObjLastNonGCIndex = 0x4
; 0x146ddd248: AllocateUObjectIndex (FUN_142b890d0) prints it as the pool's "(Max: %d)".
MaxObjectsNotConsideredByGC = 0x8
; 0x146ddd24c: the byte AllocateUObjectIndex (FUN_142b890d0) tests first.
OpenForDisregardForGC = 0xC
; 0x146ddd250: the chunk table that AllocateUObjectIndex (FUN_142b890d0) indexes (NumElements at 0x146ddd264).
ObjObjects = 0x10
; 0x146ddd2a8: AllocateUObjectIndex (FUN_142b890d0) calls each create listener of this array (Num at 0x146ddd2b0).
UObjectCreateListeners = 0x68
; 0x146ddd2b8: AddUObjectDeleteListener (FUN_142b89390) appends here under the lock at 0x146ddd2c8.
UObjectDeleteListeners = 0x78
; 0x146ddd2f0: the constructor (FUN_140969fd0) sets it to 1000; AllocateSerialNumber (FUN_1427f9330) increments it.
MasterSerialNumber = 0xB0
; MasterSerialNumber, an int32 at 0x146ddd2f0, is the last member. No code reads 0x146ddd2f4. 0x146ddd2f8 is
; another global (FUN_140e39b40 reads it). The struct holds pointers, so its size rounds up to 8: 0xB8.
UEP_TotalSize = 0xB8
